<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | ReadVerse</title>
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141419;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #22222a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 65px;
      background: rgba(10, 10, 12, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4%;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    
    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
    .nav-links a:hover { color: var(--text-main); }

    /* Main 404 Hero Container */
    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px 60px;
      text-align: center;
      position: relative;
    }

    /* Floating Animated Graphic */
    .graphic-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, var(--text-main) 30%, rgba(248, 250, 252, 0.1) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    .floating-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.5rem;
      color: var(--accent);
      filter: drop-shadow(0 0 25px rgba(249, 115, 22, 0.5));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); }
      50% { transform: translate(-50%, -50%) translateY(-12px) rotate(-5deg); }
    }

    .error-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .error-message {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Call to Action Buttons */
    .error-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    /* Ambient Background Light */
    .glow {
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: -1;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .error-code { font-size: 6rem; }
      .floating-icon { font-size: 2.8rem; }
      .error-title { font-size: 1.5rem; }
      .error-actions { width: 100%; flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <a href="index.html" class="logo">
      <i class="fa-solid fa-book-open-reader"></i> READVERSE
    </a>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
      <li><a href="index.html#trending"><i class="fa-solid fa-fire"></i> Trending</a></li>
      <li><a href="index.html#originals"><i class="fa-solid fa-award"></i> Originals</a></li>
    </ul>
  </header>

  <!-- Main Error Content -->
  <main class="error-container">
    <div class="glow"></div>
    
    <div class="graphic-wrapper">
      <div class="error-code">404</div>
      <i class="fa-solid fa-book-bookmark floating-icon"></i>
    </div>

    <h1 class="error-title">Chapter Not Found</h1>
    <p class="error-message">
      The page or book record you are searching for seems to have slipped off our shelves or moved to another section.
    </p>

    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Back to Homepage
      </a>
      <button class="btn btn-secondary" onclick="window.history.back()">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>
  </main>

</body>
</html>
